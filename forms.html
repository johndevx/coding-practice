<!DOCTYPE html>
<html>
    
     <head>
<title> HTML forms pratice</title>
<link rel="stylesheet" href="style.css">
     </head>

     <body>

        <h1>HTML FORMS</h1>

        <form>
            <label for="username">Enter username:</label>
            <input type="text" id="username" name="username" placeholder="your name">
            <br><br>
            <label for="email">Enter email:</label>
            <input type="email" id="email" name="email" placeholder="your email">
            <br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="choose a password">

            <p>Select your age:</p>

            <input type="radio" name="age" value="0-25" id="option-1">
            <label for="option-1">0-25</label> <br>
            <input type="radio" name="age" value="26-50" id="option-2">
            <label for="option-2">26-50</label> <br>
            <input type="radio" name="age" value="51+" id="option-3">
            <label for="option-3">51+</label>

            <br><br>

            <label for="question">Security question:</label>
            <select name="question" id="question">
                <option value="q1">What color are your favourite pair of socks?</option>
                <option value="q2">What is your mothers maiden name?</option>
                <option value="q3">What is you best ever security question?</option>
            </select>

            <br><br>

            <label for="answer">Security question answer:</label>
            <input type="text" id="answer" name="answer" placeholder="your answer">

            <br><br>
            <label for="bio">Your bio:</label><br>
            <textarea name="bio" id="bio" cols="30" rows="10" placeholder="about you..."></textarea>
            <br>

            <input type="submit" value="submit the form">

            <br> <br>

            <p class="box"> Click <a href="http://google.se">here</a> to read more about us!
            
            </p>



        </form>

     </body>

</html>
